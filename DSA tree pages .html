<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA tree pages</title>
<style>
:root{--bg:#f2f5f9;--fg:#132033;--mut:#5d6b7e;--card:#fff;--bd:#c9d3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--fg:#e4eaf2;--mut:#93a1b5;--card:#16202c;--bd:#33425a}}
:root[data-theme="dark"]{--bg:#0e141c;--fg:#e4eaf2;--mut:#93a1b5;--card:#16202c;--bd:#33425a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main,.nav{max-width:760px;margin:0 auto;padding-left:14px;padding-right:14px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.nav span{flex:1;text-align:center;color:var(--mut);font-size:14px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid hsl(215 80% 55%);outline-offset:2px}
.page{display:none;padding-bottom:50px}.page.on{display:block}
h1{font:700 28px/1.15 Georgia,"Times New Roman",serif;margin:16px 0 4px}
h2{font:700 17px/1.2 Georgia,serif;margin:32px 0 10px}
.grp{margin:20px 0 0;color:hsl(var(--h) 60% 50%);font-weight:600;font-size:14px}
.sub{color:var(--mut);margin:0 0 18px}
.row{--c:hsl(var(--h) 55% 46%);display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px}
.root{display:inline-block;background:hsl(var(--h) 55% 42%);color:#fff;font-weight:600;padding:8px 16px;border-radius:10px}
.tree ul{list-style:none;margin:0 0 0 24px;padding:0}
.tree li{position:relative;padding:7px 0 7px 26px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--bd)}
.tree li:last-child::before{bottom:auto;height:25px}
.tree li::after{content:"";position:absolute;left:0;top:25px;width:22px;border-top:2px solid var(--bd)}
.type{border:2px solid var(--c);border-radius:9px;padding:4px 11px;background:var(--card);font-weight:600;max-width:15.5rem}
.ns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;padding-left:18px;min-height:34px}
.ns::before{content:"";position:absolute;left:-12px;top:17px;width:30px;border-top:2px solid var(--bd)}
.ns em,.node,.pl{font-style:normal;font-variant-numeric:tabular-nums;border-radius:999px;padding:3px 12px;font-size:14px;background:hsl(var(--h) 60% 50%/.16);border:1px solid hsl(var(--h) 60% 50%/.55)}
.ns em,.pl{position:relative;background-color:var(--card);background-image:linear-gradient(hsl(var(--h) 60% 50%/.16),hsl(var(--h) 60% 50%/.16))}
.node,.pl{color:var(--fg);text-decoration:none;display:inline-block}.node{font-weight:600}
.node:hover{background:hsl(var(--h) 60% 50%/.32)}
.pl:hover{background-image:linear-gradient(hsl(var(--h) 60% 50%/.34),hsl(var(--h) 60% 50%/.34));text-decoration:underline}
.why{color:var(--mut);font-size:14px;align-self:center}
.lk,.order{list-style:none;margin:0;padding:0}.lk li{padding:6px 0}
.order{counter-reset:n;display:flex;flex-wrap:wrap;gap:8px 14px}
.order li{counter-increment:n;display:flex;align-items:center;gap:6px}
.order li::before{content:counter(n);color:var(--mut);font-size:13px}
@media(max-width:600px){.row{flex-direction:column;gap:8px}.type{max-width:none}.ns{padding-left:12px;margin-left:10px;border-left:2px solid var(--bd)}.ns::before{display:none}}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--fg:#111;--card:#fff;--bd:#aab;--mut:#555}.nav{display:none}.page{display:block!important;break-after:page;page-break-after:always}}
</style>
</head>
<body>

function go(n){n=Math.max(0,Math.min(N-1,isNaN(n)?0:n));cur=n;pg.forEach((s,i)=>s.classList.toggle('on',i===n));

pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);document.getElementById('home').onclick=()=>go(0);

addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
